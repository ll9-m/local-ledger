<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 独立页面 + 普通文档流：新建/编辑类别要输入名称，弹层里的输入框正是之前
     手机输入法那一串 BUG 的来源。这里页面本身可滚动，键盘交给浏览器原生处理。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#EDF1F9">
<link rel="manifest" href="manifest.json">
<title>类别管理 · 本地记账本</title>
<script>
/* 首屏前同步应用已保存的主题，避免深色用户看到一帧白底 */
(function(){
  try{
    var t=localStorage.getItem('local_ledger_theme');
    if(t==='light'||t==='dark'||t==='glass') document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="app.css">
<style>
html,body{height:auto!important;min-height:100%;overflow:visible!important;overscroll-behavior-y:auto;}
.catwrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));}
.phead{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  min-height:52px;padding:env(safe-area-inset-top,0px) 4px 0;margin:0 -16px;
  background:var(--bg);box-shadow:0 1px 0 var(--l6);}
.phead .ph-t{font-size:17px;font-weight:700;}
.phead .ph-cancel{font-size:15px;color:var(--t2);padding:8px 6px;}
.phead .ph-ok{font-size:15px;font-weight:700;color:#fff;padding:7px 13px;border-radius:14px;
  background:linear-gradient(145deg,var(--btn-a),var(--btn-b));box-shadow:0 4px 14px rgba(26,82,224,.3);}
.phead .ph-ok:active{transform:scale(.96);}
input{-webkit-appearance:none;appearance:none;border:0;background:transparent;font-family:inherit;font-size:15px;color:var(--t1);}
.tip{margin:14px 4px 0;font-size:12px;color:var(--t3);line-height:1.6;}
/* 编辑表单常驻页面（不是弹层），点新建 / ✎ 时才展开 */
.catcard{margin-top:12px;padding:12px;border-radius:var(--r-md);background:var(--w58);
  box-shadow:inset 0 1px 0 var(--w90),0 4px 12px var(--s6);}
.catcard .fh{font-size:14px;font-weight:700;margin:2px 4px 8px;}
.catcard .prev{display:flex;align-items:center;gap:10px;margin:12px 4px 0;}
.catcard .prev .ic{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;flex:0 0 38px;}
.catcard .prev b{display:block;font-size:14.5px;font-weight:700;}
.catcard .prev i{display:block;font-style:normal;font-size:11.5px;color:var(--t3);margin-top:2px;}
.catcard .btnrow{display:flex;gap:10px;margin-top:14px;}
.catcard .btnrow .btn{margin-top:0;flex:1;}
/* 列表在独立页面里不再内滚动，交给整页滚动，键盘弹起时浏览器能把输入框顶上来 */
.cmlist{flex:none;overflow:visible;margin-top:12px;}
.cmlist:empty::after{content:'该类型下暂无类别';display:block;padding:24px 4px;font-size:13px;color:var(--t3);}
</style>
</head>
<body>
<div class="bgfx"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i></div>

<div class="catwrap">
  <div class="phead">
    <button class="ph-cancel" id="cBack">返回</button>
    <span class="ph-t">类别管理</span>
    <button class="ph-ok" id="cAdd">+ 新建</button>
  </div>

  <div class="seg" id="cSeg" style="margin-top:12px;">
    <button class="on exp" data-type="expense">支出</button>
    <button data-type="income">收入</button>
  </div>

  <div class="catcard" id="cForm" style="display:none">
    <div class="fh" id="cFormTitle">新建类别</div>
    <div class="wrap" style="margin-top:0">
      <div class="frow"><span class="l">名称</span><input class="v" id="ceName" placeholder="必填，如：健身" maxlength="8"
        enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
      <div class="frow"><span class="l">图标</span><input class="v" id="ceIcon" placeholder="留空自动取首字" maxlength="2"
        enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    </div>
    <div class="pick" id="ceIcons"></div>
    <div class="pick" id="ceColors"></div>
    <div class="prev">
      <span class="ic" id="cePrevIco">＋</span>
      <span><b id="cePrevName">新类别</b><i id="cePrevSub">支出 · 保存后可在记一笔中使用</i></span>
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="ceCancel">取消</button>
      <button class="btn" id="ceSave">保存</button>
    </div>
  </div>

  <div class="cmlist" id="cmList"></div>
  <div class="tip">拖动 ⠿ 可调整顺序，排序会影响记一笔里的类别顺序。<br>内置类别只能改名换色，不能删除；删除自定义类别后，用到它的记录会归入「其他」。</div>
</div>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script>
(function(){
'use strict';

var cmType='expense';
var ceId=null, ceColor='#2A6BFF', ceIcon='';
var form=document.getElementById('cForm');

(function(){
  var t='glass';
  try{ var s=localStorage.getItem('local_ledger_theme'); if(s) t=s; }catch(e){}
  applyTheme(t,false);
})();
loadCats(); load();

/* ---------- 收支类型 ---------- */
function syncSeg(){
  Array.prototype.forEach.call(document.querySelectorAll('#cSeg button'),function(b){
    b.className = b.getAttribute('data-type')===cmType ? ('on '+(cmType==='income'?'inc':'exp')) : '';
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#cSeg button'),function(b){
  b.addEventListener('click',function(){
    hideKeyboard();
    cmType=b.getAttribute('data-type');
    closeForm(); syncSeg(); renderList();
  });
});
syncSeg();

/* ---------- 列表 ---------- */
function renderList(){
  var box=document.getElementById('cmList');
  var arr=catArr(cmType);
  box.innerHTML=arr.map(function(c){
    return '<div class="cmrow" data-id="'+c.id+'">'+
      '<span class="drag">⠿</span>'+
      '<span class="ci" style="background:'+c.weak+';color:'+c.color+'">'+esc(c.c)+'</span>'+
      '<span class="nm">'+esc(c.n)+'</span>'+
      (c.builtin?'<span class="builtin">内置</span>':'')+
      '<button class="op" data-act="edit">✎</button>'+
      (c.builtin?'':'<button class="op dg" data-act="del">🗑</button>')+
      '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.op'),function(btn){
    btn.addEventListener('click',function(){
      var id=btn.parentNode.getAttribute('data-id');
      if(btn.getAttribute('data-act')==='edit') openForm(id); else delCat(id);
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll('.drag'),function(h){
    h.addEventListener('pointerdown',function(e){ startDrag(h.parentNode,e); });
  });
}

/* 拖动排序 */
var dragEl=null, dragMoved=false;
function startDrag(el,e){
  dragEl=el; dragMoved=false;
  el.classList.add('dragging');
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
  document.addEventListener('pointermove',onDragMove);
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
}
function onDragMove(e){
  if(!dragEl) return;
  dragMoved=true;
  var y=e.clientY, list=document.getElementById('cmList');
  var rows=Array.prototype.slice.call(list.querySelectorAll('.cmrow'));
  for(var i=0;i<rows.length;i++){
    var r=rows[i]; if(r===dragEl) continue;
    var rc=r.getBoundingClientRect();
    if(y>rc.top && y<rc.bottom){
      list.insertBefore(dragEl, y<rc.top+rc.height/2 ? r : r.nextSibling);
      break;
    }
  }
}
function endDrag(){
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',endDrag);
  document.removeEventListener('pointercancel',endDrag);
  if(!dragEl) return;
  dragEl.classList.remove('dragging');
  if(dragMoved){
    var list=document.getElementById('cmList');
    var order=Array.prototype.map.call(list.querySelectorAll('.cmrow'),function(r){return r.getAttribute('data-id');});
    var arr=catArr(cmType);
    var next=order.map(function(id){
      for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; }
      return null;
    }).filter(Boolean);
    CATS[cmType]=next; saveCats(); markDirty();
  }
  dragEl=null; renderList();
}

/* ---------- 新建 / 编辑表单 ---------- */
function hideKeyboard(){
  var a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){ try{ a.blur(); }catch(e){} }
}
function openForm(id){
  var c=null;
  if(id){ var arr=catArr(cmType); for(var i=0;i<arr.length;i++){ if(arr[i].id===id) c=arr[i]; } }
  ceId=c?c.id:null;
  ceColor=c?c.color:PALETTE[Math.floor(Math.random()*PALETTE.length)];
  ceIcon=c?c.c:'';
  document.getElementById('cFormTitle').textContent = c? '编辑类别' : '新建类别';
  document.getElementById('ceName').value = c? c.n : '';
  document.getElementById('ceIcon').value = c? c.c : '';
  renderPicks(); syncPreview();
  form.style.display='';
  // 表单在页面顶部、页面可滚动，键盘由浏览器原生顶起；这里只做一次滚动定位
  form.scrollIntoView({block:'start'});
  if(!c) setTimeout(function(){
    if(form.style.display!=='none'){ try{ document.getElementById('ceName').focus(); }catch(e){} }
  },180);
}
function closeForm(){
  hideKeyboard();
  form.style.display='none';
  ceId=null;
}
document.getElementById('cAdd').addEventListener('click',function(){ openForm(null); });
document.getElementById('ceCancel').addEventListener('click',closeForm);

function renderPicks(){
  var ib=document.getElementById('ceIcons');
  ib.innerHTML=ICONS.map(function(x){
    return '<button data-ic="'+esc(x)+'" class="'+(x===ceIcon?'on':'')+'"><span class="ic">'+esc(x)+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(ib.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){
      hideKeyboard();
      ceIcon=b.getAttribute('data-ic');
      document.getElementById('ceIcon').value=ceIcon;
      renderPicks(); syncPreview();
    });
  });
  var cb=document.getElementById('ceColors');
  cb.innerHTML=PALETTE.map(function(hex){
    return '<button data-c="'+hex+'" class="'+(hex===ceColor?'on':'')+'"><span class="swatch" style="background:'+hex+'"></span></button>';
  }).join('');
  Array.prototype.forEach.call(cb.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){
      hideKeyboard();
      ceColor=b.getAttribute('data-c'); renderPicks(); syncPreview();
    });
  });
}
function syncPreview(){
  var n=document.getElementById('ceName').value.trim();
  var ic=document.getElementById('ceIcon').value.trim()||n.slice(0,1)||'＋';
  var wk=weakOf(ceColor);
  var el=document.getElementById('cePrevIco');
  el.textContent=ic; el.style.background=wk; el.style.color=ceColor;
  document.getElementById('cePrevName').textContent=n||'新类别';
  document.getElementById('cePrevSub').textContent=(cmType==='income'?'收入':'支出')+' · 保存后可在记一笔中使用';
}
document.getElementById('ceName').addEventListener('input',syncPreview);
document.getElementById('ceIcon').addEventListener('input',function(){ ceIcon=this.value.trim(); syncPreview(); });

document.getElementById('ceSave').addEventListener('click',function(){
  hideKeyboard();
  var n=document.getElementById('ceName').value.trim();
  if(!n){ toast('请填写类别名称'); return; }
  var ic=document.getElementById('ceIcon').value.trim()||n.slice(0,1);
  var arr=catArr(cmType);
  for(var i=0;i<arr.length;i++){
    if(arr[i].id!==ceId && arr[i].n===n){ toast('已存在同名类别'); return; }
  }
  if(ceId){
    for(var j=0;j<arr.length;j++){
      if(arr[j].id===ceId){ arr[j].n=n; arr[j].c=ic; arr[j].color=ceColor; arr[j].weak=weakOf(ceColor); break; }
    }
  }else{
    arr.push({id:'c_'+uid(),n:n,c:ic,color:ceColor,weak:weakOf(ceColor),builtin:false});
  }
  saveCats(); markDirty();
  closeForm(); renderList();
  toast(ceId?'已保存':'已添加类别');
});

/* ---------- 删除 ---------- */
function delCat(id){
  var arr=catArr(cmType), c=null;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id) c=arr[i]; }
  if(!c) return;
  if(c.builtin){ toast('内置类别不可删除'); return; }
  var used=0;
  data.forEach(function(r){ if(r.type===cmType && r.cat===id) used++; });
  var msg = used? ('删除「'+c.n+'」？有 '+used+' 笔记录使用该类别，删除后将归入「其他」。') : ('删除类别「'+c.n+'」？');
  if(!confirm(msg)) return;
  var fallback = cmType==='income'?'other_i':'other_e';
  data.forEach(function(r){ if(r.type===cmType && r.cat===id) r.cat=fallback; });
  CATS[cmType]=arr.filter(function(x){return x.id!==id;});
  save(); saveCats(); markDirty(); renderList();
  toast('已删除类别');
}

/* ---------- 返回 ---------- */
function markDirty(){ try{ localStorage.setItem('local_ledger_dirty',String(Date.now())); }catch(e){} }
function goHome(){ hideKeyboard(); location.replace('index.html'); }
document.getElementById('cBack').addEventListener('click',goHome);
/* 回车即收键盘 */
function onEnter(e){
  if(e.key!=='Enter' && e.keyCode!==13) return;
  e.preventDefault(); hideKeyboard();
}
['ceName','ceIcon'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',onEnter);
});
/* 键盘弹出后的一次性兜底：文档流页面浏览器本就会滚，个别机型差几十像素 */
document.addEventListener('focusin',function(e){
  var t=e.target;
  if(!t || (t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA')) return;
  setTimeout(function(){
    var a=document.activeElement;
    if(!a || (a.tagName!=='INPUT'&&a.tagName!=='TEXTAREA')) return;
    var vh=(window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var r=a.getBoundingClientRect();
    if(!r || !r.bottom) return;
    var over=r.bottom-(vh-16);
    if(over>0 && window.scrollBy){ try{ window.scrollBy(0,over+8); }catch(err){} }
  },320);
});

renderList();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
